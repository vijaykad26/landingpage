<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>creditcarddetails</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <h1>🚌 KOMBAN TRAVELS</h1>
        <h2>Credit Card Payment</h2>
        <p>Enter your card details</p>

        <form action="payment-completed.html">
        <label><strong>Card Holder Name</strong></label>
        <input type="text" placeholder="enter card holder name" required><br><br>
        <label><strong>Card Number</strong></label>
        <input type="text" placeholder="Enter card number" maxlength="12" required><br><br>
        <label><strong>Expiry date</strong></label>
        <input type="month" required><br><br>
        <label><strong>CVV</strong></label>
        <input type="password" placeholder="Enter CVV" maxlength="4" required><br><br>
        <label><strong>Amount</strong></label>
        <input type="text" value="₹2000" ><br><br>
        <button type="submit">pay ₹2,000</button>
        </form><br><br>
        <a href="payment.html">back to payment</a>

    
</body>
</html>
